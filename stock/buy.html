<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>运行 Python 脚本</title>
</head>
<body>
    <h1>点击按钮运行 ETF 分析</h1>
    <button onclick="runPython()">运行分析</button>
    <pre id="output">等待运行结果...</pre>

    <script>
        function runPython() {
            fetch('/run-script', {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('output').textContent = data.output || data.error;
            });
        }
    </script>
</body>
</html>
